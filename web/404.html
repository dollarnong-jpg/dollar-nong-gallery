<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · DOLLAR NONG</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0c0c0d;--text:#ecebe7;--muted:#96938c;--accent:#c9a86a;
    --serif:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);display:grid;place-items:center;padding:32px;text-align:center}
  .code{font-family:var(--serif);font-size:clamp(56px,14vw,120px);color:var(--accent);margin:0;line-height:1;letter-spacing:.04em}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(20px,3.4vw,30px);margin:22px 0 10px;letter-spacing:.06em}
  p{color:var(--muted);margin:0 0 30px;font-size:14px;letter-spacing:.06em}
  a.back{display:inline-block;padding:13px 30px;border:1px solid rgba(255,255,255,.4);border-radius:2px;
    font-size:12px;letter-spacing:.26em;color:inherit;text-decoration:none;transition:.35s}
  a.back:hover{background:var(--text);color:#0c0c0d;border-color:var(--text)}
</style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>这个页面不存在</h1>
